<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BunRelay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      :root {
        --bg-deep: #0c0e14;
        --bg-surface: #12151e;
        --bg-elevated: #181c28;
        --bg-hover: #1e2336;
        --border: #252a3a;
        --border-subtle: #1c2030;
        --text-primary: #e2e6f0;
        --text-secondary: #7a8299;
        --text-muted: #4a5068;
        --accent: #22d3a7;
        --accent-dim: #1a9e7e;
        --accent-glow: rgba(34,211,167,.12);
        --danger: #f45866;
        --danger-glow: rgba(244,88,102,.1);
        --warn: #f0a840;
        --sent-bg: #162a3a;
        --received-bg: #1a1e2c;
        --online: #22d3a7;
        --offline: #4a5068;
        --typing: #f0a840;
        --radius: 8px;
        --radius-lg: 14px;
        --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
        --font-sans: 'DM Sans', system-ui, sans-serif;
        --ease: cubic-bezier(.4,0,.2,1);
      }

      html, body { height: 100%; overflow: hidden; }

      body {
        font-family: var(--font-sans);
        background: var(--bg-deep);
        color: var(--text-primary);
        line-height: 1.5;
      }

      /* ── Scrollbar ── */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

      /* ── Login Overlay ── */
      .login-overlay {
        position: fixed; inset: 0; z-index: 100;
        display: flex; align-items: center; justify-content: center;
        background: var(--bg-deep);
        transition: opacity .4s var(--ease), visibility .4s;
      }
      .login-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

      .login-card {
        width: 380px;
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 40px 32px;
        position: relative;
        overflow: hidden;
      }
      .login-card::before {
        content: '';
        position: absolute; top: -1px; left: 32px; right: 32px; height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
      }

      .login-logo {
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 28px;
        letter-spacing: -1px;
        margin-bottom: 4px;
      }
      .login-logo span { color: var(--accent); }

      .login-subtitle {
        font-size: 13px;
        color: var(--text-muted);
        font-family: var(--font-mono);
        margin-bottom: 32px;
      }

      .field { margin-bottom: 20px; }
      .field label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--text-secondary);
        margin-bottom: 6px;
        font-family: var(--font-mono);
      }

      .field select, .field input {
        width: 100%;
        padding: 11px 14px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-primary);
        font: 14px/1.4 var(--font-sans);
        outline: none;
        transition: border-color .2s;
        -webkit-appearance: none;
      }
      .field select:focus, .field input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-glow);
      }
      .field select { cursor: pointer; }
      .field select option { background: var(--bg-elevated); }

      .login-btn {
        width: 100%;
        padding: 12px;
        background: var(--accent);
        color: var(--bg-deep);
        font: 600 14px var(--font-mono);
        letter-spacing: .5px;
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
        transition: all .2s var(--ease);
        position: relative;
        overflow: hidden;
      }
      .login-btn:hover { background: #2eeabd; transform: translateY(-1px); box-shadow: 0 4px 20px var(--accent-glow); }
      .login-btn:active { transform: translateY(0); }
      .login-btn:disabled { opacity: .5; cursor: wait; transform: none; }

      .login-error {
        margin-top: 12px;
        padding: 10px 14px;
        background: rgba(244,88,102,.08);
        border: 1px solid rgba(244,88,102,.2);
        border-radius: var(--radius);
        color: var(--danger);
        font-size: 13px;
        display: none;
      }
      .login-error.show { display: block; }

      /* ── App Layout ── */
      .app {
        display: grid;
        grid-template-columns: 260px 1fr;
        height: 100vh;
        opacity: 0;
        transition: opacity .4s var(--ease);
      }
      .app.visible { opacity: 1; }

      /* ── Connection Status Bar ── */
      .conn-status {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 90;
        padding: 6px 16px;
        font: 500 12px var(--font-mono);
        text-align: center;
        transform: translateY(-100%);
        transition: transform .3s var(--ease), background .3s;
      }
      .conn-status.show { transform: translateY(0); }
      .conn-status.reconnecting {
        background: linear-gradient(90deg, rgba(240,168,64,.15), rgba(240,168,64,.25));
        color: var(--warn);
        border-bottom: 1px solid rgba(240,168,64,.2);
      }
      .conn-status.disconnected {
        background: linear-gradient(90deg, rgba(244,88,102,.15), rgba(244,88,102,.25));
        color: var(--danger);
        border-bottom: 1px solid rgba(244,88,102,.2);
      }

      /* ── Toast ── */
      .toast-container {
        position: fixed;
        top: 16px; right: 16px;
        z-index: 200;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
      }
      .toast {
        padding: 12px 18px;
        border-radius: var(--radius);
        font: 13px var(--font-sans);
        pointer-events: auto;
        animation: toastIn .35s var(--ease) both;
        max-width: 360px;
        box-shadow: 0 8px 32px rgba(0,0,0,.4);
      }
      .toast.info {
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        color: var(--text-primary);
      }
      .toast.warn {
        background: rgba(240,168,64,.12);
        border: 1px solid rgba(240,168,64,.25);
        color: var(--warn);
      }
      .toast.error {
        background: rgba(244,88,102,.12);
        border: 1px solid rgba(244,88,102,.25);
        color: var(--danger);
      }
      .toast.leaving {
        animation: toastOut .3s var(--ease) forwards;
      }

      @keyframes toastIn {
        from { opacity: 0; transform: translateX(40px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes toastOut {
        to { opacity: 0; transform: translateX(40px); }
      }

      /* ── Sidebar ── */
      .sidebar {
        background: var(--bg-surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
      }
      .sidebar-header {
        padding: 20px 20px 16px;
        border-bottom: 1px solid var(--border-subtle);
      }
      .sidebar-brand {
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 18px;
        letter-spacing: -0.5px;
      }
      .sidebar-brand span { color: var(--accent); }

      .sidebar-user {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        padding: 8px 10px;
        background: var(--bg-elevated);
        border-radius: var(--radius);
      }
      .user-avatar {
        width: 28px; height: 28px;
        border-radius: 50%;
        background: var(--accent-dim);
        display: flex; align-items: center; justify-content: center;
        font: 600 12px var(--font-mono);
        color: var(--bg-deep);
        text-transform: uppercase;
        flex-shrink: 0;
      }
      .user-info { flex: 1; min-width: 0; }
      .user-name {
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .user-status {
        font-size: 10px;
        color: var(--accent);
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: .8px;
      }
      .logout-btn {
        background: none; border: none; cursor: pointer;
        color: var(--text-muted);
        padding: 4px;
        transition: color .2s;
        flex-shrink: 0;
      }
      .logout-btn:hover { color: var(--danger); }
      .logout-btn svg { display: block; }

      .sidebar-label {
        padding: 16px 20px 8px;
        font: 600 10px var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--text-muted);
      }
      .room-list {
        flex: 1;
        overflow-y: auto;
        padding: 0 8px;
      }
      .room-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: var(--radius);
        cursor: pointer;
        transition: background .15s, opacity .2s;
        margin-bottom: 2px;
        position: relative;
      }
      .room-item:hover { background: var(--bg-hover); }
      .room-item.active { background: var(--accent-glow); }
      .room-item.active .room-icon { color: var(--accent); }
      .room-item.removed {
        opacity: .4;
        pointer-events: none;
      }
      .room-icon {
        font-size: 16px;
        color: var(--text-muted);
        width: 20px; text-align: center;
        flex-shrink: 0;
      }
      .room-name {
        font-size: 14px;
        font-weight: 500;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .room-unread {
        font: 600 10px var(--font-mono);
        background: var(--accent);
        color: var(--bg-deep);
        padding: 1px 7px;
        border-radius: 10px;
        display: none;
      }
      .room-unread.show { display: block; }

      .sidebar-footer {
        padding: 12px 16px;
        border-top: 1px solid var(--border-subtle);
      }
      .join-row {
        display: flex;
        gap: 6px;
      }
      .join-input {
        flex: 1; min-width: 0;
        padding: 8px 10px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-primary);
        font: 13px var(--font-mono);
        outline: none;
        transition: border-color .2s;
      }
      .join-input:focus { border-color: var(--accent); }
      .join-input::placeholder { color: var(--text-muted); }
      .join-btn {
        padding: 8px 12px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 14px;
        transition: all .2s;
      }
      .join-btn:hover { border-color: var(--accent); color: var(--accent); }

      /* ── Chat Area ── */
      .chat {
        display: flex;
        flex-direction: column;
        background: var(--bg-deep);
        min-width: 0;
      }

      .chat-header {
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--bg-surface);
        flex-shrink: 0;
      }
      .chat-room-icon { font-size: 18px; color: var(--text-muted); }
      .chat-room-info { flex: 1; }
      .chat-room-name { font-weight: 600; font-size: 15px; }
      .chat-room-meta {
        font: 12px var(--font-mono);
        color: var(--text-muted);
      }

      .members-toggle {
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-secondary);
        cursor: pointer;
        padding: 6px 10px;
        font: 12px var(--font-mono);
        transition: all .2s;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .members-toggle:hover { border-color: var(--accent); color: var(--accent); }
      .members-toggle .dot-row { display: flex; gap: 3px; }
      .members-toggle .m-dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--offline);
      }
      .members-toggle .m-dot.online { background: var(--online); }

      /* ── Members Drawer ── */
      .members-drawer {
        width: 0;
        overflow: hidden;
        background: var(--bg-surface);
        border-left: 1px solid var(--border);
        transition: width .25s var(--ease);
        flex-shrink: 0;
      }
      .members-drawer.open { width: 220px; }
      .members-drawer-inner {
        width: 220px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .members-drawer-title {
        font: 600 10px var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--text-muted);
        margin-bottom: 12px;
      }
      .members-list {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .member-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: var(--radius);
        transition: background .15s;
      }
      .member-row:hover { background: var(--bg-hover); }
      .member-avatar {
        width: 24px; height: 24px;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font: 600 9px var(--font-mono);
        color: var(--bg-deep);
        text-transform: uppercase;
        flex-shrink: 0;
        position: relative;
      }
      .member-presence-ring {
        position: absolute;
        bottom: -1px; right: -1px;
        width: 8px; height: 8px;
        border-radius: 50%;
        border: 2px solid var(--bg-surface);
        background: var(--offline);
      }
      .member-presence-ring.online { background: var(--online); }
      .member-info { flex: 1; min-width: 0; }
      .member-name {
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .member-role {
        font: 10px var(--font-mono);
        text-transform: uppercase;
        letter-spacing: .8px;
      }
      .member-role.admin { color: var(--warn); }
      .member-role.owner { color: var(--accent); }
      .member-role.member { color: var(--text-muted); }

      .chat-empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: var(--text-muted);
      }
      .chat-empty-icon { font-size: 48px; opacity: .3; }
      .chat-empty-text {
        font: 13px var(--font-mono);
        text-align: center;
        line-height: 1.8;
      }

      /* ── Messages ── */
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .msg-group {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin-top: 12px;
      }
      .msg-group:first-child { margin-top: 0; }

      .msg-sender-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 2px;
      }
      .msg-avatar {
        width: 24px; height: 24px;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font: 600 10px var(--font-mono);
        color: var(--bg-deep);
        text-transform: uppercase;
        flex-shrink: 0;
      }
      .msg-sender-name {
        font-size: 13px;
        font-weight: 600;
      }
      .msg-sender-time {
        font: 11px var(--font-mono);
        color: var(--text-muted);
      }

      .msg-bubble {
        padding: 8px 14px;
        border-radius: 4px 12px 12px 12px;
        font-size: 14px;
        line-height: 1.55;
        max-width: 560px;
        word-wrap: break-word;
        margin-left: 32px;
        position: relative;
        animation: msgIn .25s var(--ease) both;
      }
      .msg-bubble.received {
        background: var(--received-bg);
        border: 1px solid var(--border-subtle);
      }
      .msg-bubble.sent {
        background: var(--sent-bg);
        border: 1px solid rgba(34,211,167,.1);
        margin-left: auto;
        margin-right: 0;
        border-radius: 12px 4px 12px 12px;
      }

      .msg-ticks {
        display: inline-flex;
        align-items: center;
        gap: 1px;
        margin-left: 6px;
        vertical-align: middle;
        opacity: .5;
      }
      .msg-ticks.delivered { opacity: .7; }
      .msg-ticks.read { opacity: 1; color: var(--accent); }
      .msg-ticks svg { display: block; }

      @keyframes msgIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .msg-system {
        text-align: center;
        font: 12px var(--font-mono);
        color: var(--text-muted);
        padding: 8px 0;
        animation: msgIn .3s var(--ease) both;
      }
      .msg-system .accent { color: var(--accent); }
      .msg-system .warn { color: var(--warn); }
      .msg-system .danger { color: var(--danger); }

      .typing-indicator {
        padding: 4px 0 4px 32px;
        font: 12px var(--font-mono);
        color: var(--typing);
        min-height: 24px;
        transition: opacity .2s;
      }
      .typing-indicator:empty { opacity: 0; }

      /* ── Composer ── */
      .composer {
        padding: 16px 24px;
        border-top: 1px solid var(--border);
        background: var(--bg-surface);
        flex-shrink: 0;
      }
      .composer.disabled {
        opacity: .4;
        pointer-events: none;
      }
      .composer-inner {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 4px 6px 4px 16px;
        transition: border-color .2s;
      }
      .composer-inner:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-glow);
      }
      .composer-input {
        flex: 1;
        background: none;
        border: none;
        color: var(--text-primary);
        font: 14px var(--font-sans);
        outline: none;
        padding: 10px 0;
      }
      .composer-input::placeholder { color: var(--text-muted); }

      .send-btn {
        width: 38px; height: 38px;
        border-radius: 10px;
        border: none;
        background: var(--accent);
        color: var(--bg-deep);
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: all .2s var(--ease);
        flex-shrink: 0;
      }
      .send-btn:hover { background: #2eeabd; transform: scale(1.05); }
      .send-btn:active { transform: scale(.95); }
      .send-btn:disabled { opacity: .3; cursor: default; transform: none; }
      .send-btn svg { display: block; }

      /* ── Removed banner ── */
      .removed-banner {
        padding: 14px 24px;
        background: var(--danger-glow);
        border-top: 1px solid rgba(244,88,102,.2);
        text-align: center;
        font: 13px var(--font-mono);
        color: var(--danger);
        flex-shrink: 0;
        animation: msgIn .3s var(--ease) both;
      }

      /* ── Presence colors ── */
      .color-0 { --user-color: #22d3a7; }
      .color-1 { --user-color: #6c8cff; }
      .color-2 { --user-color: #f0a840; }
      .color-3 { --user-color: #f45866; }
      .color-4 { --user-color: #c084fc; }
      .color-5 { --user-color: #34d399; }
      .color-6 { --user-color: #fb923c; }
      .color-7 { --user-color: #60a5fa; }

      /* ── Chat body wrapper (for drawer layout) ── */
      .chat-body {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      .chat-body .chat-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      /* ── Responsive ── */
      @media (max-width: 700px) {
        .app { grid-template-columns: 1fr; }
        .sidebar { display: none; }
        .members-drawer { display: none; }
      }

      /* ── Noise overlay ── */
      body::after {
        content: '';
        position: fixed; inset: 0;
        pointer-events: none;
        z-index: 9999;
        opacity: .025;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-size: 200px;
      }
    </style>
  </head>
  <body>

    <!-- Connection Status Bar -->
    <div class="conn-status" id="connStatus"></div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Login Screen -->
    <div class="login-overlay" id="loginOverlay">
      <div class="login-card">
        <div class="login-logo">Bun<span>Relay</span></div>
        <div class="login-subtitle">// real-time chat demo</div>

        <div class="field">
          <label>usuario</label>
          <select id="username">
            <option value="alice">alice</option>
            <option value="bob">bob</option>
            <option value="carlos">carlos</option>
            <option value="diana">diana</option>
            <option value="erin">erin</option>
          </select>
        </div>
        <div class="field">
          <label>senha</label>
          <input type="password" id="password" value="password123" />
        </div>
        <button class="login-btn" id="loginBtn">Conectar</button>
        <div class="login-error" id="loginError"></div>
      </div>
    </div>

    <!-- Main App -->
    <div class="app" id="app">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-brand">Bun<span>Relay</span></div>
          <div class="sidebar-user" id="sidebarUser">
            <div class="user-avatar" id="userAvatar"></div>
            <div class="user-info">
              <div class="user-name" id="userName"></div>
              <div class="user-status">online</div>
            </div>
            <button class="logout-btn" id="logoutBtn" title="Sair">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="sidebar-label">Salas</div>
        <div class="room-list" id="roomList"></div>

        <div class="sidebar-footer">
          <div class="join-row">
            <input class="join-input" id="joinRoomInput" placeholder="room_id" value="room_general" />
            <button class="join-btn" id="joinBtn" title="Entrar">+</button>
          </div>
        </div>
      </aside>

      <!-- Chat -->
      <section class="chat" id="chatSection">
        <div class="chat-empty" id="chatEmpty">
          <div class="chat-empty-icon">&#x2752;</div>
          <div class="chat-empty-text">
            Selecione uma sala na barra lateral<br />
            ou entre em uma nova sala abaixo
          </div>
        </div>

        <div class="chat-header" id="chatHeader" style="display:none">
          <div class="chat-room-icon">#</div>
          <div class="chat-room-info">
            <div class="chat-room-name" id="chatRoomName"></div>
            <div class="chat-room-meta" id="chatRoomMeta"></div>
          </div>
          <button class="members-toggle" id="membersToggle">
            <div class="dot-row" id="chatMembers"></div>
            <span id="memberCount">0</span>
          </button>
        </div>

        <div class="chat-body" id="chatBody" style="display:none">
          <div class="chat-main">
            <div class="messages" id="messages"></div>
            <div class="typing-indicator" id="typingIndicator"></div>
            <div class="removed-banner" id="removedBanner" style="display:none">
              Voce foi removido desta sala
            </div>
            <div class="composer" id="composer">
              <div class="composer-inner">
                <input class="composer-input" id="messageInput" placeholder="Escreva uma mensagem..." />
                <button class="send-btn" id="sendBtn" disabled>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <div class="members-drawer" id="membersDrawer">
            <div class="members-drawer-inner">
              <div class="members-drawer-title">Membros</div>
              <div class="members-list" id="membersList"></div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script>
      // ── State ──
      let accessToken = '';
      let refreshToken = '';
      let ws = null;
      let currentUserId = '';
      let currentUsername = '';
      let activeRoom = '';
      let membersDrawerOpen = false;
      const seenMessages = new Set();
      const roomData = new Map();    // roomId -> { messages: [], members: [], typing: Set, unread: 0, removed: false }
      const presenceMap = new Map(); // userId -> { status, lastSeen }
      const msgStatus = new Map();   // messageId -> 'pending' | 'delivered' | 'read'
      const deviceId = localStorage.getItem('bunrelay_device_id') || crypto.randomUUID();
      localStorage.setItem('bunrelay_device_id', deviceId);

      // Reconnection state
      let reconnectAttempts = 0;
      let reconnectTimer = null;
      const MAX_RECONNECT_DELAY = 30000;

      // user colors
      const userColors = ['color-0','color-1','color-2','color-3','color-4','color-5','color-6','color-7'];
      const userColorMap = new Map();
      let colorIdx = 0;
      function userColor(userId) {
        if (!userColorMap.has(userId)) {
          userColorMap.set(userId, userColors[colorIdx++ % userColors.length]);
        }
        return userColorMap.get(userId);
      }

      function initials(name) {
        return name.replace('user_', '').slice(0, 2).toUpperCase();
      }

      function displayName(userId) {
        return userId.replace('user_', '');
      }

      function timeStr(ts) {
        const d = new Date(ts);
        return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      }

      // ── Toast system ──
      function showToast(message, type = 'info', duration = 4000) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = message;
        container.appendChild(toast);

        setTimeout(() => {
          toast.classList.add('leaving');
          setTimeout(() => toast.remove(), 300);
        }, duration);
      }

      // ── Connection status ──
      function setConnStatus(state, text) {
        const el = document.getElementById('connStatus');
        el.className = 'conn-status';
        if (state === 'hidden') {
          el.classList.remove('show');
          return;
        }
        el.classList.add('show', state);
        el.textContent = text;
      }

      // ── DOM ──
      const $ = id => document.getElementById(id);

      const loginOverlay = $('loginOverlay');
      const loginBtn = $('loginBtn');
      const loginError = $('loginError');
      const appEl = $('app');
      const usernameEl = $('username');
      const passwordEl = $('password');
      const roomListEl = $('roomList');
      const joinRoomInput = $('joinRoomInput');
      const joinBtn = $('joinBtn');
      const chatEmpty = $('chatEmpty');
      const chatHeader = $('chatHeader');
      const chatBody = $('chatBody');
      const messagesEl = $('messages');
      const typingIndicator = $('typingIndicator');
      const composerEl = $('composer');
      const messageInput = $('messageInput');
      const sendBtn = $('sendBtn');
      const chatRoomName = $('chatRoomName');
      const chatRoomMeta = $('chatRoomMeta');
      const chatMembers = $('chatMembers');
      const memberCount = $('memberCount');
      const userAvatar = $('userAvatar');
      const userName = $('userName');
      const logoutBtn = $('logoutBtn');
      const membersToggle = $('membersToggle');
      const membersDrawer = $('membersDrawer');
      const membersList = $('membersList');
      const removedBanner = $('removedBanner');

      // ── WS helpers ──
      function wsSend(type, data) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({
          type,
          id: 'evt_' + crypto.randomUUID().slice(0, 12),
          ts: Date.now(),
          data
        }));
      }

      // ── Login ──
      loginBtn.onclick = async () => {
        loginBtn.disabled = true;
        loginBtn.textContent = 'Conectando...';
        loginError.classList.remove('show');

        try {
          const res = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              username: usernameEl.value,
              password: passwordEl.value,
              deviceId
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data?.error?.message || 'falha no login');

          accessToken = data.accessToken;
          refreshToken = data.refreshToken;
          currentUserId = data.user.id;
          currentUsername = data.user.username;

          userAvatar.textContent = initials(currentUserId);
          userName.textContent = currentUsername;

          connectWs();
        } catch (e) {
          loginError.textContent = e.message;
          loginError.classList.add('show');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Conectar';
        }
      };

      passwordEl.addEventListener('keydown', e => {
        if (e.key === 'Enter') loginBtn.click();
      });

      // ── Logout ──
      logoutBtn.onclick = () => {
        clearTimeout(reconnectTimer);
        reconnectAttempts = 0;
        if (ws) { ws.onclose = null; ws.close(); ws = null; }
        accessToken = '';
        refreshToken = '';
        currentUserId = '';
        activeRoom = '';
        membersDrawerOpen = false;
        seenMessages.clear();
        roomData.clear();
        presenceMap.clear();
        msgStatus.clear();
        roomListEl.innerHTML = '';
        messagesEl.innerHTML = '';
        membersList.innerHTML = '';
        loginOverlay.classList.remove('hidden');
        appEl.classList.remove('visible');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Conectar';
        setConnStatus('hidden', '');
      };

      // ── Members drawer toggle ──
      membersToggle.onclick = () => {
        membersDrawerOpen = !membersDrawerOpen;
        membersDrawer.classList.toggle('open', membersDrawerOpen);
        if (membersDrawerOpen && activeRoom) renderMembersList();
      };

      // ── WebSocket ──
      function connectWs() {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${proto}//${location.host}/ws`);

        ws.onopen = () => {
          setConnStatus('hidden', '');
          reconnectAttempts = 0;
          wsSend('auth:hello', { token: accessToken, deviceId });
        };

        ws.onmessage = (ev) => {
          const pkt = JSON.parse(ev.data);
          handleServerEvent(pkt);
        };

        ws.onclose = () => {
          if (!accessToken) return; // logged out intentionally
          scheduleReconnect();
        };

        ws.onerror = () => {
          // onclose will fire after this
        };
      }

      function scheduleReconnect() {
        reconnectAttempts++;
        const delay = Math.min(1000 * Math.pow(2, reconnectAttempts - 1), MAX_RECONNECT_DELAY);
        setConnStatus('reconnecting', `Reconectando em ${Math.round(delay / 1000)}s...`);
        reconnectTimer = setTimeout(() => {
          setConnStatus('reconnecting', 'Reconectando...');
          tryReconnect();
        }, delay);
      }

      async function tryReconnect() {
        // Try token refresh first
        if (refreshToken) {
          try {
            const res = await fetch('/auth/refresh', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ refreshToken })
            });
            if (res.ok) {
              const data = await res.json();
              accessToken = data.accessToken;
              refreshToken = data.refreshToken;
            }
          } catch {
            // proceed with current token
          }
        }
        connectWs();
      }

      // ── Event handler ──
      function handleServerEvent(pkt) {
        const { type, data } = pkt;

        switch (type) {
          case 'auth:ok':
            loginOverlay.classList.add('hidden');
            appEl.classList.add('visible');
            setConnStatus('hidden', '');
            // Re-join all rooms on reconnect
            if (roomData.size > 0) {
              for (const [roomId, room] of roomData) {
                if (!room.removed) {
                  wsSend('room:join', { roomId, cursor: room.cursor || undefined });
                }
              }
            } else {
              joinRoom('room_general');
            }
            break;

          case 'auth:error':
            loginError.textContent = data.message;
            loginError.classList.add('show');
            loginOverlay.classList.remove('hidden');
            loginBtn.disabled = false;
            loginBtn.textContent = 'Conectar';
            setConnStatus('disconnected', 'Falha na autenticacao');
            break;

          case 'room:snapshot':
            handleSnapshot(data);
            break;

          case 'msg:new':
            handleNewMessage(data);
            break;

          case 'msg:ack_server':
            msgStatus.set(data.messageId, 'sent');
            updateTicksForMessage(data.messageId);
            break;

          case 'msg:delivered':
            if (data.userId !== currentUserId) {
              msgStatus.set(data.messageId, 'delivered');
              updateTicksForMessage(data.messageId);
            }
            break;

          case 'msg:read':
            if (data.userId !== currentUserId) {
              markMessagesReadUpTo(data.roomId, data.cursor);
            }
            break;

          case 'typing:update':
            handleTypingUpdate(data);
            break;

          case 'presence:update':
            presenceMap.set(data.userId, { status: data.status, lastSeen: data.lastSeen });
            updatePresenceDots();
            if (membersDrawerOpen && activeRoom) renderMembersList();
            break;

          case 'room:member:update':
            handleMemberUpdate(data);
            break;

          case 'error':
            addSystemMessage(activeRoom, `erro: <span class="danger">${data.code}</span> — ${data.message}`);
            break;
        }
      }

      // ── room:member:update handler ──
      function handleMemberUpdate(data) {
        const { roomId, userId, action, role, actorUserId } = data;
        const room = roomData.get(roomId);

        const actorName = displayName(actorUserId);
        const userName = displayName(userId);

        if (action === 'added') {
          if (room) {
            // Add member to room's member list if not already present
            if (!room.members.find(m => m.userId === userId)) {
              room.members.push({ userId, role: role || 'member' });
            }
          }
          addSystemMessage(roomId, `<span class="accent">${actorName}</span> adicionou <span class="accent">${userName}</span> a sala`);
          showToast(`${userName} entrou em ${roomId.replace('room_', '')}`, 'info');

        } else if (action === 'removed') {
          if (userId === currentUserId) {
            // Current user was removed
            if (room) {
              room.removed = true;
            }
            addSystemMessage(roomId, `<span class="danger">Voce foi removido desta sala por ${actorName}</span>`);
            showToast(`Voce foi removido de ${roomId.replace('room_', '')}`, 'error', 6000);

            // If viewing this room, show removed state
            if (activeRoom === roomId) {
              showRoomRemovedState();
            }
            // Mark sidebar item as removed
            const sidebarItem = roomListEl.querySelector(`[data-room="${roomId}"]`);
            if (sidebarItem) sidebarItem.classList.add('removed');

          } else {
            // Another user was removed
            if (room) {
              room.members = room.members.filter(m => m.userId !== userId);
            }
            addSystemMessage(roomId, `<span class="warn">${actorName}</span> removeu <span class="warn">${userName}</span> da sala`);
          }

        } else if (action === 'role_updated') {
          if (room) {
            const member = room.members.find(m => m.userId === userId);
            if (member) member.role = role;
          }
          addSystemMessage(roomId, `<span class="accent">${actorName}</span> alterou o papel de <span class="accent">${userName}</span> para <span class="warn">${role}</span>`);
          if (userId === currentUserId) {
            showToast(`Seu papel foi alterado para ${role}`, 'info');
          }

        } else if (action === 'owner_transferred') {
          if (room) {
            // Update old owner to admin
            const oldOwner = room.members.find(m => m.userId === actorUserId);
            if (oldOwner) oldOwner.role = 'admin';
            // Update new owner
            const newOwner = room.members.find(m => m.userId === userId);
            if (newOwner) newOwner.role = 'owner';
          }
          addSystemMessage(roomId, `<span class="accent">${actorName}</span> transferiu a propriedade para <span class="accent">${userName}</span>`);
          if (userId === currentUserId) {
            showToast(`Voce agora e o dono da sala`, 'info');
          }
        }

        // Update UI
        if (activeRoom === roomId) {
          updatePresenceDots();
          updateChatMeta();
          if (membersDrawerOpen) renderMembersList();
        }
      }

      function showRoomRemovedState() {
        composerEl.classList.add('disabled');
        removedBanner.style.display = '';
        messageInput.disabled = true;
        sendBtn.disabled = true;
      }

      function hideRoomRemovedState() {
        composerEl.classList.remove('disabled');
        removedBanner.style.display = 'none';
        messageInput.disabled = false;
      }

      function updateChatMeta() {
        if (!activeRoom || !roomData.has(activeRoom)) return;
        const room = roomData.get(activeRoom);
        chatRoomMeta.textContent = `${room.members.length} membros`;
        memberCount.textContent = room.members.length;
      }

      // ── Members drawer ──
      function renderMembersList() {
        if (!activeRoom || !roomData.has(activeRoom)) return;
        const room = roomData.get(activeRoom);
        membersList.innerHTML = '';

        // Sort: owner first, then admins, then alphabetical
        const rolePriority = { owner: 0, admin: 1, member: 2 };
        const sorted = [...room.members].sort((a, b) => {
          const pa = rolePriority[a.role] ?? 2;
          const pb = rolePriority[b.role] ?? 2;
          if (pa !== pb) return pa - pb;
          return displayName(a.userId).localeCompare(displayName(b.userId));
        });

        for (const m of sorted) {
          const color = userColor(m.userId);
          const p = presenceMap.get(m.userId);
          const isOnline = p && p.status === 'online';

          const row = document.createElement('div');
          row.className = `member-row ${color}`;
          row.innerHTML = `
            <div class="member-avatar" style="background: var(--user-color)">
              ${initials(m.userId)}
              <div class="member-presence-ring ${isOnline ? 'online' : ''}"></div>
            </div>
            <div class="member-info">
              <div class="member-name">${displayName(m.userId)}${m.userId === currentUserId ? ' (voce)' : ''}</div>
              <div class="member-role ${m.role}">${m.role}</div>
            </div>
          `;
          membersList.appendChild(row);
        }
      }

      // ── Delivery ticks ──
      function tickSvg(double, color) {
        if (double) {
          return `<span class="msg-ticks ${color}"><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 6 4 9 9 2"/><polyline points="5 6 8 9 13 2"/></svg></span>`;
        }
        return `<span class="msg-ticks"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 6 4 9 11 2"/></svg></span>`;
      }

      function updateTicksForMessage(messageId) {
        const el = document.querySelector(`[data-msgid="${messageId}"] .msg-ticks`);
        if (!el) return;
        const status = msgStatus.get(messageId);
        if (status === 'delivered') {
          el.outerHTML = tickSvg(true, 'delivered');
        } else if (status === 'read') {
          el.outerHTML = tickSvg(true, 'read');
        }
      }

      function markMessagesReadUpTo(roomId, cursor) {
        const room = roomData.get(roomId);
        if (!room) return;
        for (const msg of room.messages) {
          if (msg.senderId === currentUserId) {
            if (msg.ts <= cursor.ts) {
              msgStatus.set(msg.messageId, 'read');
              updateTicksForMessage(msg.messageId);
            }
          }
        }
      }

      // ── Room join ──
      function joinRoom(roomId) {
        if (!roomId) return;
        wsSend('room:join', { roomId });
      }

      joinBtn.onclick = () => {
        const roomId = joinRoomInput.value.trim();
        if (roomId) joinRoom(roomId);
      };
      joinRoomInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') joinBtn.click();
      });

      function handleSnapshot(data) {
        const existing = roomData.get(data.roomId);
        const room = {
          id: data.roomId,
          members: data.members || [],
          messages: existing ? existing.messages : [],
          typing: existing ? existing.typing : new Set(),
          cursor: data.cursor,
          unread: existing ? existing.unread : 0,
          removed: false
        };

        if (!existing) {
          addRoomToSidebar(data.roomId);
        }

        roomData.set(data.roomId, room);

        for (const msg of data.messages) {
          if (!seenMessages.has(msg.messageId)) {
            seenMessages.add(msg.messageId);
            room.messages.push(msg);
            wsSend('msg:delivered', { roomId: data.roomId, messageId: msg.messageId });
          }
        }

        switchToRoom(data.roomId);
      }

      function addRoomToSidebar(roomId) {
        const el = document.createElement('div');
        el.className = 'room-item';
        el.dataset.room = roomId;
        el.innerHTML = `
          <div class="room-icon">#</div>
          <div class="room-name">${roomId.replace('room_', '')}</div>
          <div class="room-unread" data-unread="${roomId}"></div>
        `;
        el.onclick = () => switchToRoom(roomId);
        roomListEl.appendChild(el);
      }

      function switchToRoom(roomId) {
        if (!roomData.has(roomId)) return;
        const room = roomData.get(roomId);

        // Don't switch to removed room
        if (room.removed) return;

        activeRoom = roomId;

        // Reset unread
        room.unread = 0;
        updateUnreadBadge(roomId);

        // Update sidebar active
        roomListEl.querySelectorAll('.room-item').forEach(el => {
          el.classList.toggle('active', el.dataset.room === roomId);
        });

        // Show chat UI
        chatEmpty.style.display = 'none';
        chatHeader.style.display = '';
        chatBody.style.display = '';

        chatRoomName.textContent = roomId.replace('room_', '');
        updateChatMeta();

        // Handle removed state
        if (room.removed) {
          showRoomRemovedState();
        } else {
          hideRoomRemovedState();
          sendBtn.disabled = false;
        }

        updatePresenceDots();
        renderMessages(roomId);
        updateTypingDisplay(roomId);
        if (membersDrawerOpen) renderMembersList();
        messageInput.focus();
      }

      function updateUnreadBadge(roomId) {
        const badge = document.querySelector(`[data-unread="${roomId}"]`);
        if (!badge) return;
        const room = roomData.get(roomId);
        if (room && room.unread > 0) {
          badge.textContent = room.unread > 99 ? '99+' : room.unread;
          badge.classList.add('show');
        } else {
          badge.classList.remove('show');
        }
      }

      function updatePresenceDots() {
        if (!activeRoom || !roomData.has(activeRoom)) return;
        const room = roomData.get(activeRoom);
        chatMembers.innerHTML = '';
        const shown = room.members.slice(0, 6);
        for (const m of shown) {
          const dot = document.createElement('div');
          dot.className = 'm-dot';
          const p = presenceMap.get(m.userId);
          if (p && p.status === 'online') dot.classList.add('online');
          dot.title = displayName(m.userId);
          chatMembers.appendChild(dot);
        }
        memberCount.textContent = room.members.length;
      }

      // ── Messages ──
      function renderMessages(roomId) {
        const room = roomData.get(roomId);
        if (!room) return;
        messagesEl.innerHTML = '';

        let lastSender = null;
        for (const msg of room.messages) {
          if (msg.senderId !== lastSender) {
            addSenderHeader(msg);
            lastSender = msg.senderId;
          }
          addBubble(msg);
        }

        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function addSenderHeader(msg) {
        const row = document.createElement('div');
        row.className = `msg-sender-row ${userColor(msg.senderId)}`;
        row.innerHTML = `
          <div class="msg-avatar" style="background: var(--user-color)">${initials(msg.senderId)}</div>
          <span class="msg-sender-name" style="color: var(--user-color)">${displayName(msg.senderId)}</span>
          <span class="msg-sender-time">${timeStr(msg.ts)}</span>
        `;
        messagesEl.appendChild(row);
      }

      function addBubble(msg) {
        const isMine = msg.senderId === currentUserId;
        const bubble = document.createElement('div');
        bubble.className = `msg-bubble ${isMine ? 'sent' : 'received'}`;
        bubble.dataset.msgid = msg.messageId;

        let ticksHtml = '';
        if (isMine) {
          const status = msgStatus.get(msg.messageId) || 'pending';
          if (status === 'read') {
            ticksHtml = tickSvg(true, 'read');
          } else if (status === 'delivered') {
            ticksHtml = tickSvg(true, 'delivered');
          } else {
            ticksHtml = tickSvg(false, '');
          }
        }

        bubble.innerHTML = `${escapeHtml(msg.content)}${ticksHtml}`;
        messagesEl.appendChild(bubble);
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function addSystemMessage(roomId, html) {
        // Always store for the room, but only render if active
        if (roomId !== activeRoom) return;
        const el = document.createElement('div');
        el.className = 'msg-system';
        el.innerHTML = html;
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function handleNewMessage(data) {
        if (seenMessages.has(data.messageId)) return;
        seenMessages.add(data.messageId);

        const room = roomData.get(data.roomId);
        if (!room) return;

        room.messages.push(data);

        // clear typing for this sender
        room.typing.delete(data.senderId);
        if (data.roomId === activeRoom) {
          updateTypingDisplay(data.roomId);
        }

        // ack delivery
        wsSend('msg:delivered', { roomId: data.roomId, messageId: data.messageId });

        if (data.roomId === activeRoom) {
          const msgs = room.messages;
          const prev = msgs.length >= 2 ? msgs[msgs.length - 2] : null;
          if (!prev || prev.senderId !== data.senderId) {
            addSenderHeader(data);
          }
          addBubble(data);
          messagesEl.scrollTop = messagesEl.scrollHeight;

          // mark as read
          wsSend('msg:read', {
            roomId: data.roomId,
            cursor: { ts: data.ts, messageId: data.messageId }
          });
        } else {
          // Increment unread
          room.unread = (room.unread || 0) + 1;
          updateUnreadBadge(data.roomId);
        }
      }

      // ── Typing ──
      let typingTimeout = null;
      let isTyping = false;

      messageInput.addEventListener('input', () => {
        if (!activeRoom) return;
        const room = roomData.get(activeRoom);
        if (room && room.removed) return;

        if (!isTyping) {
          isTyping = true;
          wsSend('typing:set', { roomId: activeRoom, isTyping: true });
        }
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
          isTyping = false;
          wsSend('typing:set', { roomId: activeRoom, isTyping: false });
        }, 2500);
      });

      function handleTypingUpdate(data) {
        const room = roomData.get(data.roomId);
        if (!room) return;
        if (data.userId === currentUserId) return;

        if (data.isTyping) {
          room.typing.add(data.userId);
        } else {
          room.typing.delete(data.userId);
        }

        if (data.roomId === activeRoom) {
          updateTypingDisplay(data.roomId);
        }
      }

      function updateTypingDisplay(roomId) {
        const room = roomData.get(roomId);
        if (!room) return;
        const typers = [...room.typing].map(displayName);
        if (typers.length === 0) {
          typingIndicator.textContent = '';
        } else if (typers.length === 1) {
          typingIndicator.textContent = `${typers[0]} esta digitando...`;
        } else {
          typingIndicator.textContent = `${typers.join(', ')} estao digitando...`;
        }
      }

      // ── Send message ──
      function sendMessage() {
        const content = messageInput.value.trim();
        if (!content || !activeRoom) return;

        const room = roomData.get(activeRoom);
        if (room && room.removed) return;

        const messageId = 'msg_' + crypto.randomUUID().slice(0, 12);
        msgStatus.set(messageId, 'pending');

        wsSend('msg:send', {
          roomId: activeRoom,
          messageId,
          content
        });

        // Stop typing
        if (isTyping) {
          isTyping = false;
          clearTimeout(typingTimeout);
          wsSend('typing:set', { roomId: activeRoom, isTyping: false });
        }

        messageInput.value = '';
        messageInput.focus();
      }

      sendBtn.onclick = sendMessage;
      messageInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // ── Heartbeat ──
      setInterval(() => {
        wsSend('presence:ping', {});
      }, 30000);
    </script>
  </body>
</html>
