name: SonarQube

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_PROJECT_NAME: ${{ vars.SONAR_PROJECT_NAME }}
    steps:
      - name: Check SonarQube config
        id: sonar_config
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ] && [ -n "$SONAR_PROJECT_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SonarQube is not configured; skipping scan."
          fi

      - name: Checkout
        if: steps.sonar_config.outputs.enabled == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        if: steps.sonar_config.outputs.enabled == 'true'
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        if: steps.sonar_config.outputs.enabled == 'true'
        run: bun install --frozen-lockfile

      - name: Build checks before scan
        if: steps.sonar_config.outputs.enabled == 'true'
        run: bun run ci

      - name: SonarQube Scan
        if: steps.sonar_config.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.projectName=${{ env.SONAR_PROJECT_NAME != '' && env.SONAR_PROJECT_NAME || env.SONAR_PROJECT_KEY }}
