name: SonarQube

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  scan:
    if: ${{ secrets.SONAR_TOKEN != '' && secrets.SONAR_HOST_URL != '' && vars.SONAR_PROJECT_KEY != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d2677860a20522ff53cbed5412fa3c8a70f8440 # v2.1.2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build checks before scan
        run: bun run ci

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@1a6d90ebf5fbc8ef7ef32e2b8220861f0e2b50b0 # v5.3.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.projectName=${{ vars.SONAR_PROJECT_NAME != '' && vars.SONAR_PROJECT_NAME || vars.SONAR_PROJECT_KEY }}
